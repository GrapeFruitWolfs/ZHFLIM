name: Verify Delivery Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install rendering browser (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install rendering browser (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Verify local launcher and reopening
        if: runner.os == 'Linux'
        run: npm run test:runtime
      - name: Build and execute Windows portable runtime
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: npm run package:windows
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.pdf
            test-results/**/*.jpg
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep verified Windows package
        if: success() && runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WeddingDeliveryStudio-Windows-x64
          path: |
            release/*.zip
            release/*.sha256
            release/*/build-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
